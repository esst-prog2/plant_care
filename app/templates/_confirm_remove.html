<div class="overlay" role="dialog" aria-modal="true" aria-label="Confirm removal">
  <div class="dialog">
    <h2>Remove {{ plant.name }}?</h2>
    <p>This deletes the plant and its watering data.</p>
    <div class="actions">
      <button type="button" class="danger" hx-post="/plants/{{ plant.id }}/remove" hx-include="#page-input" hx-target="#grid-wrap">Remove</button>
      <button type="button" onclick="this.closest('.overlay').remove()">Cancel</button>
    </div>
  </div>
</div>

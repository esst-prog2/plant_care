<div class="overlay" role="dialog" aria-modal="true" aria-label="Edit {{ current_name }}">
  <div class="dialog">
    <button type="button" class="close" aria-label="Close" onclick="this.closest('.overlay').remove()">&times;</button>
    <h2>Edit group</h2>
    <form hx-post="{{ rename_url }}" hx-target="#groups-wrap" hx-encoding="multipart/form-data" hx-include="#groups-page-input">
      <input type="text" name="name" value="{{ current_name }}" required autofocus>
      {% include "_cover_picker.html" %}
      {% if photo_error %}
      <p class="notice">{{ photo_error }}</p>
      {% endif %}
      <div class="actions">
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>
</div>

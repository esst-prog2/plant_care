{% if results %}
<ul class="results">
  {% for r in results %}
  <li><button type="button" hx-get="/plants/confirm" hx-vals='{{ {"type_id": r.type_id, "name": r.name}|tojson }}' hx-target="#modal">{{ r.name }}</button></li>
  {% endfor %}
</ul>
{% elif q %}
<p>No plants found.</p>
{% else %}
<p class="hint">Start typing to search.</p>
{% endif %}
